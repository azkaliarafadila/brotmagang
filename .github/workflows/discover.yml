name: Daily internship discovery
on:
  push:
    paths:
      - 'opportunities.json'
      - 'scripts/discover.py'
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-internship-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public feeds and score candidate matches
        run: python scripts/discover.py
      - name: Commit refreshed opportunity feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh internship discovery feed"
            git push
          fi
